name: tmp-fonts
on:
  push:
    branches: [contract-and-details]
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fonts, ranges and host tests
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet fonttools
          git clone -q --depth 1 --branch v9.3.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
          npm install --silent --prefix "$RUNNER_TEMP/conv" lv_font_conv@1.5.3
          export EH3D_FONT_DIR="$RUNNER_TEMP/lvgl/scripts/built_in_font"
          export LV_FONT_CONV="$RUNNER_TEMP/conv/node_modules/.bin/lv_font_conv"
          python3 tools/make_fonts.py
          python3 -I tools/make_locales.py --check
          mkdir out && cp main/fonts/eh3d_font_16.c main/fonts/eh3d_font_24.c core/font_ranges.hpp out/
          cmake -S tests -B build/host && cmake --build build/host -j4 && ctest --test-dir build/host -V | grep -E "checks|tests passed|Failed|FAILED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: out
          path: out/
