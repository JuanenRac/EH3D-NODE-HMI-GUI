name: tmp-module
on:
  push:
    branches: [own-module-drivers]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build, map and notices
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build/p4 -D SDKCONFIG=build/p4/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.board.p4" set-target esp32p4
          idf.py -B build/p4 -D SDKCONFIG=build/p4/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.board.p4" build
          python3 tools/third_party_notices.py build/p4/project_description.json
          mkdir out
          cp dependencies.lock docs/THIRD_PARTY_NOTICES build/p4/*.map out/
          ls managed_components
          echo "Archives of managed components in the link map:"
          grep -o "esp-idf/[a-z0-9_.-]*__[a-z0-9_.-]*/lib[a-z0-9_.-]*\.a" build/p4/*.map | sort -u || true
          echo "Camera or image pipeline names in the link map:"
          grep -ciE "esp_ipa|esp_video|esp_cam_sensor" build/p4/*.map || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: out
          path: out/
